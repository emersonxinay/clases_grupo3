<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti - Sorpresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;300;400;600&family=Great+Vibes&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="canvas-container"></div>

    <div id="overlay" class="active">
        <div id="start-btn">
            <div class="seed"></div>
            <span>Toca la luz...</span>
        </div>
    </div>

    <div class="ui-layer" id="ui-layer">
        <div class="floating-text">
            <h1 class="title-anim">Para Ti <span class="emoji">🌻</span></h1>
            <p class="subtitle-anim">
                Un universo de girasoles para la flor que me fascina,<br>
                porque tu sonrisa es la luz que mi vida ilumina.<br><br>
                Con cariño infinito te dedico este pequeño verso,<br>
                de parte de Emerson, para el centro de mi universo.
            </p>
        </div>
    </div>

    <!-- Three.js and Post-Processing Dependencies via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script src="main.js"></script>
</body>

</html>
